# The unit tests and the browser tests, run on GitHub's machines so a push waits there and not on the lead's box.
# Only the public copy of the game runs this (scripts/publish-clean.ts makes that copy); the private repository does not.
name: ci
on:
  push:
    branches: [main, ci]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The unit tests, one job at four workers, as `bun run test` runs them. A runner of a public repository has four cores
  # like the lead's box, where the whole pass takes about 130 s, so it is shorter than a browser part (about 6 minutes)
  # and is not split by `bun test --shard`. Its longest file, tests/fight-model.test.ts (about 100 s alone), could not
  # be shortened by a shard anyway. The room API tests here use the memory store; the next job runs them on Postgres.
  unit:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test --parallel=4
  # The room API against Postgres, the store the deploy uses (AGENTS.md, "Run, test, check"): the same two files with
  # DATABASE_URL set, in one process so they do not share the database at the same time.
  unit-postgres:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test tests/server-rooms.test.ts tests/server-handshake.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  browser:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The tests' sizes are those of a phone's own font. A bare runner falls back to DejaVu Sans, wider than any phone's,
      # and two layouts then wrap (found on the first run: the 1280 px nav, a status dialog's button). Inter stands in.
      - run: |
          sudo apt-get install -y fonts-inter
          mkdir -p ~/.config/fontconfig/conf.d
          cp .github/prefer-inter.conf ~/.config/fontconfig/conf.d/56-prefer-inter.conf
          fc-cache -f && fc-match system-ui
      # the full Chromium, not the headless shell: the shell refuses notifications (AGENTS.md, "Set up once")
      - run: echo "E2E_CHROMIUM=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)" >> "$GITHUB_ENV"
      - run: bunx playwright test --shard=${{ matrix.shard }}/6
        env:
          CI: '1'
          E2E_PORT: '3218'
          E2E_FEEL: skip
